spring.application.name=university-store

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/university_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flujo automatico de ordenes. Los plazos son dias reales del calendario.
simulation.enabled=true
# Cada cuanto se revisa si alguna orden debe avanzar (milisegundos)
simulation.check-interval-ms=60000
# Pagada -> Enviada
simulation.days-to-ship=1
# Enviada -> Entregada
simulation.days-to-deliver=3
# Entregada -> el cliente decide si pide devolucion (ruleta: probabilidad de 0 a 1)
simulation.days-to-request-return=2
simulation.return-request-chance=0.2
# Devolucion solicitada -> la bodega acepta o rechaza (ruleta: probabilidad de aceptar)
simulation.days-to-resolve-return=3
simulation.return-accept-chance=0.7
