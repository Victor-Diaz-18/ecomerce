spring.application.name=university-store

# En la nube el proveedor indica el puerto con la variable PORT
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/university_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicio de sesion. Estos valores son solo para desarrollo en tu PC: en la nube se definen con las
# variables JWT_SECRET, ADMIN_EMAIL y ADMIN_PASSWORD, y la app se niega a arrancar si faltan.
security.jwt.secret=${JWT_SECRET:12345678901234567890123456789012}
security.jwt.expiration-seconds=86400
# Cuenta del administrador, creada al arrancar si no existe
security.admin.email=${ADMIN_EMAIL:admin@universitystore.com}
security.admin.password=${ADMIN_PASSWORD:admin12345}
security.require-secrets=${SECURITY_REQUIRE_SECRETS:false}

# Flujo automatico de ordenes. Los plazos son dias reales del calendario.
simulation.enabled=true
# Cada cuanto se revisa si alguna orden debe avanzar (milisegundos)
simulation.check-interval-ms=60000
# Sede desde la que despacha la tienda. Solo se envia dentro de este pais
simulation.origin-city=Santa Marta
simulation.origin-country=Colombia
# Pagada -> Enviada: lo pagado antes de la hora de corte sale ese dia; lo demas, el siguiente dia habil
simulation.cutoff-hour=14
# Enviada -> Entregada: dias habiles (lunes a sabado) segun la zona del destino.
# Urbano 1, regional 2, nacional 3 y dificil acceso 6 siguen los plazos maximos de 24/48/72/144 horas
# que usa Colombia Compra Eficiente para servicios postales. Regional = hasta estos km de la sede.
simulation.regional-max-km=300
simulation.transit-days-same-city=1
simulation.transit-days-regional=2
simulation.transit-days-national=3
simulation.transit-days-remote=6
# Ruleta de la entrega: probabilidad de llegar un dia antes / uno o dos dias despues de lo estimado
simulation.early-delivery-chance=0.2
simulation.late-delivery-chance=0.2
# Devolucion solicitada -> la bodega acepta o rechaza (ruleta: probabilidad de aceptar)
simulation.days-to-resolve-return=3
simulation.return-accept-chance=0.7
